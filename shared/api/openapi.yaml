openapi: 3.0.3
info:
  title: MAX Bot Integration API
  description: API для мобильного клиента
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработчика
  - url: https://api.your-server.ru/api/v1
    description: Продакшн сервер
paths:
  /users/me:
    get:
      summary: Получить профиль текущего пользователя
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Неавторизован

  /bot/history:
    get:
      summary: Получить историю команд и ответов бота
      operationId: getBotHistory
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Количество записей
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список событий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BotEvent'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: integer
          example: 123456
        username:
          type: string
          example: "ivan_ivanov"
        avatar_url:
          type: string
          example: "https://example.com/avatar.jpg"

    BotEvent:
      type: object
      required:
        - id
        - type
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: "message_created"
          description: Тип события из вебхука МАХ
        text:
          type: string
          example: "/start"
        timestamp:
          type: integer
          example: 1737500130100