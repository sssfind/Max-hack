name: Bootstrap production SSH fingerprint

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  fingerprint:
    name: Read production SSH fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read ECDSA host key
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          key="$(ssh-keyscan -T 10 -t ecdsa "$SERVER_HOST" 2>/dev/null)"
          test -n "$key"
          fingerprint="$(printf '%s\n' "$key" | ssh-keygen -lf - -E sha256 | awk 'NR == 1 {print $2}')"
          case "$fingerprint" in
            SHA256:*) ;;
            *) echo "Invalid SSH fingerprint" >&2; exit 1 ;;
          esac
          echo "::error title=Production SSH fingerprint::$fingerprint"
          exit 1
