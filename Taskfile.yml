version: "3"

vars:
  BIN_DIR: "{{.ROOT_DIR}}/bin"
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint{{exeExt}}"
  GOVULNCHECK: "{{.BIN_DIR}}/govulncheck{{exeExt}}"
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.1.4

tasks:
  tools:
    desc: Установить зафиксированные версии инструментов в ./bin
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
    env:
      GOBIN: "{{.BIN_DIR}}"
    sources:
      - Taskfile.yml
    generates:
      - "{{.GOLANGCI_LINT}}"
      - "{{.GOVULNCHECK}}"

  fmt:
    desc: Отформатировать Go-код
    cmds:
      - go fmt ./...

  vet:
    desc: Запустить go vet
    cmds:
      - go vet ./...

  lint:
    desc: Запустить golangci-lint
    deps: [tools]
    cmds:
      - '"{{.GOLANGCI_LINT}}" run ./... --timeout=5m'

  test:
    desc: Запустить юнит-тесты
    cmds:
      - go test -count=1 ./...

  test-race:
    desc: Запустить тесты с race detector
    cmds:
      - go test -race -count=1 ./...

  test-coverage:
    desc: Собрать отчёт о покрытии в coverage.out
    cmds:
      - go test -count=1 -covermode=atomic "-coverprofile=coverage.out" ./...
      - go tool cover -func=coverage.out

  vuln:
    desc: Проверить достижимые уязвимости Go
    deps: [tools]
    cmds:
      - '"{{.GOVULNCHECK}}" ./...'

  build-go:
    desc: Собрать все Go-команды
    cmds:
      - go build ./cmd/...

  verify:
    desc: Полная локальная проверка перед push
    cmds:
      - task: vet
      - task: lint
      - task: test-race
      - task: test-coverage
      - task: vuln
      - task: build-go

  compose:
    desc: Проверить конфигурацию Docker Compose на безопасном примере
    cmds:
      - docker compose --env-file .env.example --profile observability config --quiet

  build:
    desc: Собрать production-образ
    cmds:
      - docker build --pull --tag skillgap:local .

  up:
    desc: Собрать и запустить обязательный контур
    cmds:
      - docker compose up -d --build

  observability:
    desc: Запустить SkillGap, Prometheus и Grafana
    cmds:
      - docker compose --profile observability up -d --build

  restart:
    desc: Перезапустить приложение
    cmds:
      - docker compose restart app

  logs:
    desc: Показать логи приложения
    cmds:
      - docker compose logs --follow app

  status:
    desc: Показать статус контейнеров
    cmds:
      - docker compose ps

  down:
    desc: Остановить контейнеры, сохранив PostgreSQL volume
    cmds:
      - docker compose --profile observability down
