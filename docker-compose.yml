services:
  db:
    image: postgres:17.0-alpine3.20
    restart: always
    container_name: max-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - max-network

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "./migrator" ]
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - max-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./max-bot"]
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - MAX_WEBHOOK_SECRET=${MAX_WEBHOOK_SECRET}
      - MAX_WEBHOOK_URL=${MAX_WEBHOOK_URL:-}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - TRUDVSEM_BASE_URL=${TRUDVSEM_BASE_URL:-https://opendata.trudvsem.ru/api/v1/vacancies}
      - TRUDVSEM_REQUEST_TIMEOUT=${TRUDVSEM_REQUEST_TIMEOUT:-25s}
      - TRUDVSEM_MAX_RESPONSE_BYTES=${TRUDVSEM_MAX_RESPONSE_BYTES:-8388608}
      - TRUDVSEM_REQUESTS_PER_SECOND=${TRUDVSEM_REQUESTS_PER_SECOND:-3}
      - TRUDVSEM_MAX_PAGES_PER_QUERY=${TRUDVSEM_MAX_PAGES_PER_QUERY:-2}
      - SKILLGAP_ANALYSIS_TIMEOUT=${SKILLGAP_ANALYSIS_TIMEOUT:-75s}
      - SKILLGAP_MAX_QUERIES=${SKILLGAP_MAX_QUERIES:-6}
      - SKILLGAP_QUERY_CONCURRENCY=${SKILLGAP_QUERY_CONCURRENCY:-3}
      - SKILLGAP_PER_QUERY_LIMIT=${SKILLGAP_PER_QUERY_LIMIT:-100}
      - SKILLGAP_MAX_VACANCIES=${SKILLGAP_MAX_VACANCIES:-50}
      - SKILLGAP_PDF_MAX_VACANCIES=${SKILLGAP_PDF_MAX_VACANCIES:-15}
      - SKILLGAP_ANALYSIS_WORKERS=${SKILLGAP_ANALYSIS_WORKERS:-4}
      - SKILLGAP_ANALYSIS_QUEUE=${SKILLGAP_ANALYSIS_QUEUE:-100}
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - max-network


