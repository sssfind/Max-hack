  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    volumes:
       - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - max-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    networks:
      - max-network

networks:
  max-network:
    driver: bridge

volumes:
  pgdata:
